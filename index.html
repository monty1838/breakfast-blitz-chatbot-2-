
<style>
.bb-wrap{font-family:var(--font-sans);max-width:480px;margin:0 auto}
.bb-header{background:#1a3a2a;padding:14px 18px;border-radius:var(--border-radius-lg) var(--border-radius-lg) 0 0;display:flex;align-items:center;gap:12px}
.bb-avatar{width:40px;height:40px;border-radius:50%;background:#c9a84c;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.bb-title{color:#fff;font-size:15px;font-weight:500;margin:0}
.bb-status{color:#9fe1cb;font-size:12px;margin:0}
.bb-messages{height:320px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--color-background-secondary)}
.bb-msg{max-width:82%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5}
.bb-msg.bot{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);align-self:flex-start;border-radius:4px 12px 12px 12px}
.bb-msg.user{background:#1a3a2a;color:#fff;align-self:flex-end;border-radius:12px 4px 12px 12px}
.bb-quick{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;background:var(--color-background-secondary);border-top:0.5px solid var(--color-border-tertiary)}
.bb-qbtn{font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid #1a3a2a;color:#1a3a2a;background:transparent;cursor:pointer}
.bb-qbtn:hover{background:#1a3a2a;color:#fff}
.bb-input-area{display:flex;gap:8px;padding:10px 14px;background:var(--color-background-primary);border-top:0.5px solid var(--color-border-tertiary);border-radius:0 0 var(--border-radius-lg) var(--border-radius-lg)}
.bb-input-area input{flex:1;padding:8px 12px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);font-size:14px}
.bb-input-area button{background:#1a3a2a;color:#fff;border:none;padding:8px 14px;border-radius:var(--border-radius-md);cursor:pointer;font-size:13px}
.bb-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bb-pill{background:#e1f5ee;color:#085041;font-size:11px;padding:3px 8px;border-radius:20px;border:1px solid #9fe1cb}
</style>

<h2 class="sr-only">Breakfast Blitz customer support chatbot for Banana Blitz Sport protein shake</h2>

<div class="bb-wrap" style="border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden">
  <div class="bb-header">
    <div class="bb-avatar">🍌</div>
    <div>
      <p class="bb-title">Blitz Assistant</p>
      <p class="bb-status">● Online now</p>
    </div>
    <div style="margin-left:auto;background:rgba(201,168,76,0.2);border:1px solid rgba(201,168,76,0.4);border-radius:20px;padding:4px 10px;text-align:center">
      <span style="font-size:11px;color:#e8c96a;display:block">BANANA BLITZ</span>
      <span style="font-size:11px;color:#e8c96a;display:block">SPORT RTD</span>
    </div>
  </div>

  <div class="bb-messages" id="bbmsg">
    <div class="bb-msg bot">
      Hey! Welcome to Breakfast Blitz Support. Ask me anything about Banana Blitz Sport!
      <div class="bb-pills">
        <span class="bb-pill">30g Protein</span>
        <span class="bb-pill">400ml RTD</span>
        <span class="bb-pill">HPP Cold Pressed</span>
        <span class="bb-pill">$6.50 NZD</span>
        <span class="bb-pill">Plant Based</span>
      </div>
    </div>
  </div>

  <div class="bb-quick">
    <button class="bb-qbtn" onclick="ask('Where can I buy it?')">🛒 Where to buy?</button>
    <button class="bb-qbtn" onclick="ask('How much protein does it have?')">💪 Protein content?</button>
    <button class="bb-qbtn" onclick="ask('Is it good for kids?')">👧 Good for kids?</button>
    <button class="bb-qbtn" onclick="ask('How do I store it?')">❄️ Storage tips?</button>
    <button class="bb-qbtn" onclick="ask('How much does it cost?')">💰 Price?</button>
    <button class="bb-qbtn" onclick="ask('Is it plant based?')">🌱 Plant based?</button>
  </div>

  <div class="bb-input-area">
    <input type="text" id="bbinput" placeholder="Ask about Banana Blitz Sport..." onkeydown="if(event.key==='Enter')sendMsg()"/>
    <button onclick="sendMsg()">Send</button>
  </div>
</div>

<script>
const answers=[
  {k:['where','buy','find','stock','store','supermarket','woolworths','new world','pak'],a:"You can find Banana Blitz Sport in the chilled aisle at Woolworths, New World, and Pak'nSave stores across New Zealand! Look for us in the refrigerated drinks section."},
  {k:['protein','how much protein','30g','grams'],a:"Each 400ml bottle of Banana Blitz Sport contains 30g of plant-based protein per serve — that's from our pea-rice protein blend, giving you a complete amino acid profile without the dairy."},
  {k:['kids','children','child','family','baby'],a:"Banana Blitz Sport is formulated for active adults — 30g of protein is quite a large dose for young children. We'd recommend consulting your doctor or dietitian before giving it to kids under 12. Older teens who are very active may benefit!"},
  {k:['store','storage','keep','refrigerat','fridge','cold'],a:"Keep Banana Blitz Sport refrigerated at all times — below 4°C is ideal. Because we use HPP cold processing instead of heat, the product must stay chilled to maintain freshness. Once opened, consume within 24 hours."},
  {k:['cost','price','how much','dollar','nzd','expensive'],a:"Banana Blitz Sport retails at $6.50 NZD per 400ml bottle. Given the 30g plant-based protein, electrolytes, B vitamins, and HPP processing, we think it's great value compared to other premium RTD protein shakes!"},
  {k:['plant','vegan','dairy','dairy-free','dairy free','lactose'],a:"Yes! Banana Blitz Sport is 100% plant-based. We use a pea-rice protein blend with no dairy, no whey, and no animal-derived ingredients. It's suitable for vegans and those avoiding dairy."},
  {k:['ingredient','what','made','contain','inside'],a:"Banana Blitz Sport contains: water, pea-rice protein blend (30g), banana puree, natural caramelised banana flavour, vanilla flavour, electrolytes (sodium, potassium, magnesium), B vitamins (B2, B6, B12, niacin), xanthan gum for texture, and natural sweeteners. No artificial colours or flavours!"},
  {k:['hpp','process','cold press','fresh','shelf'],a:"HPP stands for High Pressure Processing — we use cold water pressure instead of heat to make the product safe. This preserves more nutrients, natural flavour, and freshness compared to traditional heat-treated protein drinks. That's why we have a shelf life of 60-90 days refrigerated!"},
  {k:['flavour','flavor','taste','banana','vanilla','caramel'],a:"Banana Blitz Sport features a rich Caramelised Banana and Vanilla Cream flavour profile. Think warm, naturally sweet banana with a smooth, creamy vanilla finish — indulgent but totally purposeful. No artificial banana flavouring here!"},
  {k:['electrolyte','sodium','potassium','magnesium','hydrat'],a:"Each bottle contains a performance electrolyte blend — sodium, potassium, and magnesium — to support hydration and muscle function. Perfect for post-workout recovery or an active morning!"},
  {k:['vitamin','b vitamin','b12','b6','niacin','energy'],a:"Banana Blitz Sport is fortified with B vitamins including B2, B6, B12, and niacin. These support energy metabolism, reduce fatigue, and help your body use the protein effectively. Great for an active lifestyle!"},
  {k:['gym','workout','exercise','sport','athlet','recover'],a:"Banana Blitz Sport was designed for exactly that! With 30g protein for muscle recovery, electrolytes for rehydration, and B vitamins for energy metabolism — it's the perfect grab-and-go post-workout drink. No shaker required!"},
];

function getAnswer(q){
  q=q.toLowerCase();
  for(let a of answers){
    if(a.k.some(k=>q.includes(k)))return a.a;
  }
  return "Great question! For more specific information, please email us at hello@breakfastblitz.co.nz or check the product label. We're always happy to help! 🍌";
}

function addMsg(text,role){
  const div=document.getElementById('bbmsg');
  const m=document.createElement('div');
  m.className='bb-msg '+role;
  m.textContent=text;
  div.appendChild(m);
  div.scrollTop=div.scrollHeight;
}

function ask(q){
  document.getElementById('bbinput').value=q;
  sendMsg();
}

function sendMsg(){
  const input=document.getElementById('bbinput');
  const q=input.value.trim();
  if(!q)return;
  input.value='';
  addMsg(q,'user');
  setTimeout(()=>addMsg(getAnswer(q),'bot'),600);
}
</script>
